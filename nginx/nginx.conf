events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1. Основной сервер для LMS (Фронтенд и Бэкенд)
    server {
        listen 80;
        server_name localhost;

        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_pass http://students-service:4040/;
        }

        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # 2. Поддомен для авторизации пользователей (LogTo Port 3001)
    server {
        listen 80;
        server_name auth.localhost;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_pass http://logto:3001; # Без слэша на конце
        }
    }

    # 3. Поддомен для админки LogTo (LogTo Port 3002)
    server {
        listen 80;
        server_name admin.localhost;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_pass http://logto:3002; # Без слэша на конце
        }
    }
}