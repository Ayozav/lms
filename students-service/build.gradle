plugins {
    id "java"
    id "application"
    id 'com.gradleup.shadow' version '9.2.0'
}

group = "ru.ayozav"
version = "0.0.1"

repositories {
    mavenCentral()
}

application {
    mainClass.set("ru.ayozav.Main")
}

tasks.named('run') {
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'sun.stdout.encoding', 'UTF-8'
    systemProperty 'sun.stderr.encoding', 'UTF-8'
}

dependencies {
    // For Unit-tests
    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    // Javalin for web
    implementation "io.javalin:javalin:7.0.0"
    // Extra dependency from Javalin for JSON answers.
    implementation "com.fasterxml.jackson.core:jackson-databind:2.20.1"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2"
    // For logging
    implementation "org.slf4j:slf4j-simple:2.0.17"
    // Database driver
    implementation "org.postgresql:postgresql:42.7.10"
    // For Connection pools
    implementation 'com.zaxxer:HikariCP:7.0.2'
    // For easy queries
    implementation platform("org.jdbi:jdbi3-bom:3.46.0")
    implementation "org.jdbi:jdbi3-core:3.46.0"
    implementation "org.jdbi:jdbi3-sqlobject"
    // For easy migrations and controlling database.
    implementation "org.liquibase:liquibase-core:4.31.1"

}

test {
    useJUnitPlatform()
}