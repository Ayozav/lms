volumes:
    postgres_data:
        name: lms_postgres_data

    kafka1_data:
        name: lms_kafka1_data
    kafka2_data:
        name: lms_kafka2_data

    redis_master_data:
        name: redis_master_data
    redis_replica_data:
        name: redis_replica_data
    redisinsight_data:
        name: redisinsight_data


networks:
    lms-network:
        driver: bridge


services:
    # Он нам нужен для хранения вообще всей информации по LMS!
    # Часть бизнеса тоже.
    postgres:
        image: postgres:18
        container_name: "LMS.Postgres"
        restart: no

        environment:
            POSTGRES_DB: ${DATABASE_NAME}
            DATABASE_SCHEMA: ${DATABASE_SCHEMA}
            DATABASE_NAME: ${DATABASE_NAME}
            POSTGRES_USER: ${DATABASE_USERNAME}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        ports:
            - "${DATABASE_PORT}:5432"

        # Для прод. версии следует убрать!
        command: ["postgres", "-c", "log_statement=all"]

        volumes:
            - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro   # Запуск собственных инит. скрипта.
            - postgres_data:/var/lib/postgresql  # Определяем, где будет лежать вся СУБД

        # Задаём чёткий скрипт, который позволяет нам
        # убедится, что сервис живой.
        healthcheck:
            # Внутри мы указываем порт в Докере.
            # А товарищ Postgres по умолчанию на порту 5432 живёт.
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p 5432"]
            interval: 3s
            retries: 5
            start_period: 15s
            timeout: 5s

        networks:
            - lms-network

        deploy:
            resources:
                limits:
                    cpus: 1
                    memory: 512M

    # Он нам нужен, чтобы запросы агрегировать и переадресовывать туда,
    # куда следует: проверять авторизацию через LogTo, отправлять
    # нужные запросы нужным сервисам.
    # Подгружать статику: для React-приложения, в частности.
    nginx:
        image: nginx:1.29.8
        container_name: "LMS.Nginx"
        volumes:
            # Явно указываем, что настройки лежат в проектной папке
#            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            # Используем переменные окружения, чтобы при развёртывании своего домена мы не плаки-плаки.
            - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
            - ./lms-frontend/dist/:/usr/share/nginx/html:ro
        environment:
            - LMS_DOMAIN=${LMS_DOMAIN}
            - AUTH_DOMAIN=${AUTH_DOMAIN}
            - ADMIN_DOMAIN=${ADMIN_DOMAIN}
            - KAFKA_DOMAIN=${KAFKA_DOMAIN}
        ports:
            # Пробрасываем 80 порт в контейнер.
            - "80:80"
        # Прежде чем поднять Nginx - все сервисы должны подняться.
        # Тогда пользователи гарантированно получат рабочие ответы!
        depends_on:
            postgres:
                condition: service_healthy
            students-service:
                condition: service_healthy
            logto:
                condition: service_started

        networks:
            lms-network:
                aliases:
                    - localhost
                    - auth.localhost
                    - admin.localhost

        deploy:
            resources:
                limits:
                    cpus: 1
                    memory: 512M

        restart: no

    students-service:
        # Оказывается, во время разработки можно использовать утилиту:
        # docker compose watch
        # Но, чтобы её настроить следует её подложить в описании к devlop'у.
        # Поскольку все изменения обычно лежат в /src'шнике, то и путь я укажу туда
        develop:
            watch:
                # LMS собирается в jar'ник, поэтому надо каждый раз пересобирать...
                -   path: ./students-service/src/
                    action: rebuild
        restart: no

        deploy:
            resources:
                limits:
                    cpus: 1
                    memory: 512M

        depends_on:
            postgres:
                condition: service_healthy

        image: ayozav-students-service:0.0.2
        build:
            context: ./students-service

        container_name: "LMS.students-service"
        ports:
            - "4040:4040"

        networks:
            - lms-network

        env_file:
            -   .env

    logto:
        container_name: "LMS.LogTo"
        depends_on:
            postgres:
                condition: service_healthy
            students-service:
                condition: service_healthy
        image: svhd/logto:latest
        entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
        ports:
            - "3001:3001"
            - "3002:3002"
        environment:
            TRUST_PROXY_HEADER: 1
            DB_URL: ${LOGTO_DATABASE_URL}
            ENDPOINT: http://${AUTH_DOMAIN}
            ADMIN_ENDPOINT: http://${ADMIN_DOMAIN}

        deploy:
            resources:
                limits:
                    cpus: 1
                    memory: 512M

        networks:
            - lms-network

        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:3001/status" ]
            interval: 10s
            timeout: 5s
            retries: 5

